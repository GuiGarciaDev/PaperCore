<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>PaperCore Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Icons (inline SVG, no dependencies). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-pen" viewBox="0 0 24 24">
          <path d="M4 20l4-1 11-11-3-3L5 16l-1 4z" />
          <path d="M14 6l3 3" />
        </symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24">
          <path d="M8 20h12" />
          <path d="M5.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 19H8.5l-3-3a2 2 0 0 1 0-.5z" />
          <path d="M10 11l5 5" />
        </symbol>
        <symbol id="i-hand" viewBox="0 0 24 24">
          <path d="M8 12V6a1.5 1.5 0 0 1 3 0v5" />
          <path d="M11 10V4.5a1.5 1.5 0 0 1 3 0V10" />
          <path d="M14 10V6a1.5 1.5 0 0 1 3 0v6" />
          <path
            d="M17 11a1.5 1.5 0 0 1 3 0v3a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L4.3 14.6a1.5 1.5 0 0 1 2.5-1.7L8 14.5"
          />
        </symbol>
        <symbol id="i-undo" viewBox="0 0 24 24">
          <path d="M9 14L4 9l5-5" />
          <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
        </symbol>
        <symbol id="i-redo" viewBox="0 0 24 24">
          <path d="M15 14l5-5-5-5" />
          <path d="M20 9H10a6 6 0 0 0 0 12h3" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4 7h16" />
          <path d="M10 11v6M14 11v6" />
          <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
          <path d="M9 7V4h6v3" />
        </symbol>
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="12" rx="2" />
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 4v11" />
          <path d="M7 10l5 5 5-5" />
          <path d="M5 20h14" />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
          <path d="M12 15V4" />
          <path d="M7 9l5-5 5 5" />
          <path d="M5 20h14" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </symbol>
      </defs>
    </svg>

    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">PaperCore</span>
        <span class="eyebrow">Playground</span>
      </div>

      <nav class="pages" role="group" aria-label="Pages">
        <button type="button" class="icon-btn" id="prev" aria-label="Previous page" title="Previous page">
          <svg><use href="#i-left" /></svg>
        </button>
        <span id="page-label" class="page-label" aria-live="polite">1 / 1</span>
        <button type="button" class="icon-btn" id="next" aria-label="Next page" title="Next page">
          <svg><use href="#i-right" /></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" class="btn ghost" id="add-page" title="New page">
          <svg><use href="#i-plus" /></svg><span>Page</span>
        </button>
        <button
          type="button"
          class="icon-btn"
          id="duplicate-page"
          aria-label="Duplicate page"
          title="Duplicate page"
        >
          <svg><use href="#i-copy" /></svg>
        </button>
        <button type="button" class="icon-btn" id="delete-page" aria-label="Delete page" title="Delete page">
          <svg><use href="#i-trash" /></svg>
        </button>
        <select id="background" class="select" aria-label="Page background">
          <option value="ruled">Ruled</option>
          <option value="grid">Grid</option>
          <option value="blank">Blank</option>
        </select>
      </nav>

      <div class="file" role="group" aria-label="File">
        <label class="toggle" title="Read-only">
          <input type="checkbox" id="readonly" />
          <span class="toggle-track" aria-hidden="true"></span>
          <svg><use href="#i-lock" /></svg>
          <span class="toggle-label">Read-only</span>
        </label>
        <button type="button" class="btn outline" id="import" title="Import JSON">
          <svg><use href="#i-upload" /></svg><span>Import</span>
        </button>
        <button type="button" class="btn solid" id="export" title="Export JSON">
          <svg><use href="#i-download" /></svg><span>Export</span>
        </button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="stage">
      <main id="surface" aria-label="Notebook"></main>

      <!-- Floating tool dock. -->
      <div class="dock" role="toolbar" aria-label="Tools">
        <div class="segmented" role="group" aria-label="Tool">
          <button type="button" data-tool="pen" aria-pressed="true" title="Pen" aria-label="Pen">
            <svg><use href="#i-pen" /></svg>
          </button>
          <button
            type="button"
            data-tool="eraser"
            aria-pressed="false"
            title="Eraser — or the back end of the pen"
            aria-label="Eraser"
          >
            <svg><use href="#i-eraser" /></svg>
          </button>
          <button type="button" data-tool="pan" aria-pressed="false" title="Pan" aria-label="Pan">
            <svg><use href="#i-hand" /></svg>
          </button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="swatches" role="group" aria-label="Color">
          <button
            type="button"
            class="swatch"
            data-color="#1f2937"
            aria-label="Black"
            style="--c: #1f2937"
          ></button>
          <button
            type="button"
            class="swatch"
            data-color="#2563eb"
            aria-label="Blue"
            style="--c: #2563eb"
          ></button>
          <button
            type="button"
            class="swatch"
            data-color="#dc2626"
            aria-label="Red"
            style="--c: #dc2626"
          ></button>
          <button
            type="button"
            class="swatch"
            data-color="#16a34a"
            aria-label="Green"
            style="--c: #16a34a"
          ></button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <label class="range" title="Pen width">
          <span class="eyebrow">Stroke</span>
          <input id="width" type="range" min="0.5" max="12" step="0.5" value="3" />
          <output id="width-value">3</output>
        </label>
        <label class="range" title="Eraser size (screen px)">
          <span class="eyebrow">Eraser</span>
          <input id="eraser-size" type="range" min="4" max="120" step="2" value="20" />
          <output id="eraser-size-value">20</output>
        </label>

        <span class="divider" aria-hidden="true"></span>

        <div class="cluster" role="group" aria-label="History">
          <button type="button" class="icon-btn" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)">
            <svg><use href="#i-undo" /></svg>
          </button>
          <button type="button" class="icon-btn" id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">
            <svg><use href="#i-redo" /></svg>
          </button>
          <button type="button" class="btn ghost danger-text" id="clear" title="Clear page">Clear</button>
        </div>
      </div>

      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" class="icon-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out">
          <svg><use href="#i-minus" /></svg>
        </button>
        <button type="button" class="zoom-value" id="zoom-reset" title="Reset view">100%</button>
        <button type="button" class="icon-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in">
          <svg><use href="#i-plus" /></svg>
        </button>
      </div>
    </div>

    <footer class="status" aria-live="polite">
      <span id="stats">—</span>
      <span id="input-info">Pointer: —</span>
      <span id="change-info">Last change: —</span>
      <span id="save-info" class="save-info"></span>
      <span class="hint">Wheel: scroll · Ctrl+wheel/pinch: zoom · middle button: pan</span>
    </footer>

    <div id="toast" role="alert" hidden></div>

    <!-- In-page confirmation: some browsers (and webviews) block the native confirm(). -->
    <dialog id="confirm-dialog" aria-labelledby="confirm-message">
      <form method="dialog">
        <span class="eyebrow">Confirm</span>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn outline" autofocus>Cancel</button>
          <button type="submit" value="ok" id="confirm-ok" class="btn danger">Confirm</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
