<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>PaperCore Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Ícones (SVG inline, sem dependências). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-pen" viewBox="0 0 24 24">
          <path d="M4 20l4-1 11-11-3-3L5 16l-1 4z" />
          <path d="M14 6l3 3" />
        </symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24">
          <path d="M8 20h12" />
          <path d="M5.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 19H8.5l-3-3a2 2 0 0 1 0-.5z" />
          <path d="M10 11l5 5" />
        </symbol>
        <symbol id="i-hand" viewBox="0 0 24 24">
          <path d="M8 12V6a1.5 1.5 0 0 1 3 0v5" />
          <path d="M11 10V4.5a1.5 1.5 0 0 1 3 0V10" />
          <path d="M14 10V6a1.5 1.5 0 0 1 3 0v6" />
          <path
            d="M17 11a1.5 1.5 0 0 1 3 0v3a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L4.3 14.6a1.5 1.5 0 0 1 2.5-1.7L8 14.5"
          />
        </symbol>
        <symbol id="i-undo" viewBox="0 0 24 24">
          <path d="M9 14L4 9l5-5" />
          <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
        </symbol>
        <symbol id="i-redo" viewBox="0 0 24 24">
          <path d="M15 14l5-5-5-5" />
          <path d="M20 9H10a6 6 0 0 0 0 12h3" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4 7h16" />
          <path d="M10 11v6M14 11v6" />
          <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
          <path d="M9 7V4h6v3" />
        </symbol>
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="12" rx="2" />
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 4v11" />
          <path d="M7 10l5 5 5-5" />
          <path d="M5 20h14" />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
          <path d="M12 15V4" />
          <path d="M7 9l5-5 5 5" />
          <path d="M5 20h14" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </symbol>
      </defs>
    </svg>

    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">PaperCore</span>
        <span class="eyebrow">Playground</span>
      </div>

      <nav class="pages" role="group" aria-label="Páginas">
        <button type="button" class="icon-btn" id="prev" aria-label="Página anterior" title="Página anterior">
          <svg><use href="#i-left" /></svg>
        </button>
        <span id="page-label" class="page-label" aria-live="polite">1 / 1</span>
        <button type="button" class="icon-btn" id="next" aria-label="Próxima página" title="Próxima página">
          <svg><use href="#i-right" /></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" class="btn ghost" id="add-page" title="Nova página">
          <svg><use href="#i-plus" /></svg><span>Página</span>
        </button>
        <button
          type="button"
          class="icon-btn"
          id="duplicate-page"
          aria-label="Duplicar página"
          title="Duplicar página"
        >
          <svg><use href="#i-copy" /></svg>
        </button>
        <button
          type="button"
          class="icon-btn"
          id="delete-page"
          aria-label="Excluir página"
          title="Excluir página"
        >
          <svg><use href="#i-trash" /></svg>
        </button>
        <select id="background" class="select" aria-label="Fundo da página">
          <option value="ruled">Pautado</option>
          <option value="grid">Quadriculado</option>
          <option value="blank">Branco</option>
        </select>
      </nav>

      <div class="file" role="group" aria-label="Arquivo">
        <label class="toggle" title="Somente leitura">
          <input type="checkbox" id="readonly" />
          <span class="toggle-track" aria-hidden="true"></span>
          <svg><use href="#i-lock" /></svg>
          <span class="toggle-label">Leitura</span>
        </label>
        <button type="button" class="btn outline" id="import" title="Importar JSON">
          <svg><use href="#i-upload" /></svg><span>Importar</span>
        </button>
        <button type="button" class="btn solid" id="export" title="Exportar JSON">
          <svg><use href="#i-download" /></svg><span>Exportar</span>
        </button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="stage">
      <main id="surface" aria-label="Caderno"></main>

      <!-- Doca flutuante de ferramentas. -->
      <div class="dock" role="toolbar" aria-label="Ferramentas">
        <div class="segmented" role="group" aria-label="Ferramenta">
          <button type="button" data-tool="pen" aria-pressed="true" title="Caneta (P)" aria-label="Caneta">
            <svg><use href="#i-pen" /></svg>
          </button>
          <button
            type="button"
            data-tool="eraser"
            aria-pressed="false"
            title="Borracha (E) — ou a ponta traseira da caneta"
            aria-label="Borracha"
          >
            <svg><use href="#i-eraser" /></svg>
          </button>
          <button type="button" data-tool="pan" aria-pressed="false" title="Mover (H)" aria-label="Mover">
            <svg><use href="#i-hand" /></svg>
          </button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="swatches" role="group" aria-label="Cor">
          <button
            type="button"
            class="swatch"
            data-color="#1f2937"
            aria-label="Preto"
            style="--c: #1f2937"
          ></button>
          <button
            type="button"
            class="swatch"
            data-color="#2563eb"
            aria-label="Azul"
            style="--c: #2563eb"
          ></button>
          <button
            type="button"
            class="swatch"
            data-color="#dc2626"
            aria-label="Vermelho"
            style="--c: #dc2626"
          ></button>
          <button
            type="button"
            class="swatch"
            data-color="#16a34a"
            aria-label="Verde"
            style="--c: #16a34a"
          ></button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <label class="range" title="Espessura da caneta">
          <span class="eyebrow">Traço</span>
          <input id="width" type="range" min="0.5" max="12" step="0.5" value="3" />
          <output id="width-value">3</output>
        </label>
        <label class="range" title="Tamanho da borracha (px de tela)">
          <span class="eyebrow">Borracha</span>
          <input id="eraser-size" type="range" min="4" max="120" step="2" value="20" />
          <output id="eraser-size-value">20</output>
        </label>

        <span class="divider" aria-hidden="true"></span>

        <div class="cluster" role="group" aria-label="Histórico">
          <button type="button" class="icon-btn" id="undo" aria-label="Desfazer" title="Desfazer (Ctrl+Z)">
            <svg><use href="#i-undo" /></svg>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="redo"
            aria-label="Refazer"
            title="Refazer (Ctrl+Shift+Z)"
          >
            <svg><use href="#i-redo" /></svg>
          </button>
          <button type="button" class="btn ghost danger-text" id="clear" title="Limpar página">Limpar</button>
        </div>
      </div>

      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" class="icon-btn" id="zoom-out" aria-label="Diminuir zoom" title="Diminuir zoom">
          <svg><use href="#i-minus" /></svg>
        </button>
        <button type="button" class="zoom-value" id="zoom-reset" title="Voltar ao início">100%</button>
        <button type="button" class="icon-btn" id="zoom-in" aria-label="Aumentar zoom" title="Aumentar zoom">
          <svg><use href="#i-plus" /></svg>
        </button>
      </div>
    </div>

    <footer class="status" aria-live="polite">
      <span id="stats">—</span>
      <span id="input-info">Ponteiro: —</span>
      <span id="change-info">Última alteração: —</span>
      <span id="save-info" class="save-info"></span>
      <span class="hint">Roda: rolar · Ctrl+roda/pinça: zoom · botão do meio: mover</span>
    </footer>

    <div id="toast" role="alert" hidden></div>

    <!-- Confirmação dentro da página: alguns navegadores (e webviews) bloqueiam o confirm() nativo. -->
    <dialog id="confirm-dialog" aria-labelledby="confirm-message">
      <form method="dialog">
        <span class="eyebrow">Confirmar</span>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn outline" autofocus>Cancelar</button>
          <button type="submit" value="ok" id="confirm-ok" class="btn danger">Confirmar</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
